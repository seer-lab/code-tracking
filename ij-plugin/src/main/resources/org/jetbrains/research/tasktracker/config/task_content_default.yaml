  - description: |
      <html>
      <b>What to do:</b><br>
      Imagine a simple program where a variable called <code>X</code> starts at <b>0</b>. The program contains a list of statements that either add 1 or subtract 1 from <code>X</code>.<br><br>

      Each statement looks like one of these four options:<br>
      <code>X++</code> -> adds 1 to X<br>
      <code>++X</code> -> adds 1 to X<br>
      <code>X--</code> -> subtracts 1 from X<br>
      <code>--X</code> -> subtracts 1 from X<br><br>

      (It does not matter whether <code>X</code> comes before or after the <code>++</code> or <code>--</code> — the result is the same.)<br><br>

      <b>Input:</b><br>
      The first line is a number telling you how many statements follow.<br>
      Each following line contains one statement (like <code>X++</code> or <code>--X</code>).<br><br>

      <b>Output:</b> Print the final value of <code>X</code> after all statements have been executed.<br><br>
      </html>
