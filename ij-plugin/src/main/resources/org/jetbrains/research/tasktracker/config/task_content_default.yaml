  - description:  |
      <html>
      <b>Input:</b> Consists of a random sequence of 0 and 1s. If one of 0 or 1 is present 7 times in a row or more then the situation is considered dangerous; if not, then safe (inputs can not be greater than 100 characters). <br><br>
      
      <b>Output:</b> Print YES if safe and NO if not safe. <br><br>
      
      </html>
