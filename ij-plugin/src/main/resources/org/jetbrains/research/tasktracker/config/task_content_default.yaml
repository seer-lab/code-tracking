tasks:
  - description: |
      <html>
      <b>What to do:</b><br>
      You are given a single word. If the word is <b>longer than 10 characters</b>, it is considered too long and needs to be shortened using a special abbreviation.<br><br>

      <b>How to abbreviate:</b><br>
      Keep the <b>first letter</b> and the <b>last letter</b> of the word, and replace everything in between with a <b>number</b> that represents how many letters were removed.<br>
      For example, the word <code>internationalization</code> becomes <code>i18n</code> because there are 18 letters between the first <code>i</code> and the last <code>n</code>.<br><br>

      If the word is <b>10 characters or fewer</b>, just print it as-is - no abbreviation needed.<br><br>

      <b>Input:</b> A single word (1 to 100 characters long).<br><br>

      <b>Output:</b> The abbreviated word if it is longer than 10 characters, or the original word if it is not.<br><br>
      </html>
