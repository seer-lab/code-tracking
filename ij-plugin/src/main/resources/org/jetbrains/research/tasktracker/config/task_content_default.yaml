  - description:  |
      <html>
      <b>Task:</b><br>
      Vasya makes a remix by inserting the word "WUB" before the 
      <br>first word, after the last word, and between words 
      <br>(at least one between any pair). Your job is to restore 
      <br>the original song by removing all "WUB" occurrences and 
      <br>replacing them with single spaces where necessary.<br><br>
      
      <b>Input:</b><br>
      The input consists of a single non-empty string consisting only 
      <br>of uppercase English letters. The length of the string does 
      <br>not exceed 200 characters.<br><br>

      <b>Output:</b><br>
      Print the words of the initial song that Vasya used to make a 
      <br>dubsteb remix. Separate the words with a space.<br><br>

      </html>
