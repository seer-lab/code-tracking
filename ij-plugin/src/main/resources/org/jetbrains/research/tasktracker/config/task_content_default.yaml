  - description: |
      <html>
      <b>What to do:</b><br>
      You are given two numbers: <b>n</b> and <b>t</b>. Your goal is to find <b>any</b> positive number that:<br>
      1. Has exactly <b>n</b> digits (no leading zeros - so it cannot start with <code>0</code>).<br>
      2. Is evenly divisible by <b>t</b> (meaning <code>number % t == 0</code>, i.e., there is no remainder).<br><br>

      If no such number exists, print <code>-1</code>. If there are multiple valid answers, you can print any one of them.<br><br>

      <b>Input:</b> Two integers on one line: <b>n</b> (1 ≤ n ≤ 100) and <b>t</b> (2 ≤ t ≤ 10).<br><br>

      <b>Output:</b> A valid n-digit number divisible by t, or <code>-1</code> if none exists.<br><br>
      </html>
