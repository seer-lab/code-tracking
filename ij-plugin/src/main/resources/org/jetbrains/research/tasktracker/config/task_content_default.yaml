  - description: |
      <html>
      <b>What to do:</b><br>
      You are given a string of letters and need to transform it by following these three steps <b>in order</b>:<br><br>

      <b>Step 1:</b> Remove all <b>vowels</b>. The vowels are: <code>A, E, I, O, U, Y</code> (both uppercase and lowercase).<br>
      <b>Step 2:</b> Place a dot (<code>.</code>) before each remaining letter (these are all consonants now).<br>
      <b>Step 3:</b> Convert any uppercase consonants to <b>lowercase</b>.<br><br>

      <b>Input:</b> A single string of letters, between 1 and 100 characters long. It can contain both uppercase and lowercase letters.<br><br>

      <b>Output:</b> The transformed string after applying all three steps.<br><br>
      </html>
