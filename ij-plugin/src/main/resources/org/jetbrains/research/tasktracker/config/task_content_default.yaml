  - description: |
      <html>
      <b>What to do:</b><br>
      Someone has taken a song and turned it into a "dubstep remix" by inserting the word <code>WUB</code> everywhere — before the first word, after the last word, and between words.<br><br>

      Your job is to recover the <b>original words</b> of the song by removing all the <code>WUB</code>s and printing the remaining words separated by spaces.<br><br>

      <b>How it works:</b><br>
      Think of <code>WUB</code> as a separator. Wherever you see one or more <code>WUB</code>s in a row, that is a gap between words (or padding at the start/end).<br><br>

      <b>Input:</b> A single string of uppercase letters (up to 200 characters). It will contain at least one <code>WUB</code>.<br><br>

      <b>Output:</b> Print the original words of the song, separated by single spaces.<br><br>
      </html>
