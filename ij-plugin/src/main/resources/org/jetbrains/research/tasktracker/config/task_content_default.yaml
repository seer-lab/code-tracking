  - description: |
      <html>
      <b>What to do:</b><br>
      You are given a string made up of only <code>0</code>s and <code>1</code>s (like <code>1001101</code>). Your job is to check whether this string is <b>"safe"</b> or <b>"dangerous"</b>.<br><br>

      The string is <b>dangerous</b> if the same digit (<code>0</code> or <code>1</code>) appears <b>7 or more times in a row</b>.<br>
      Otherwise, it is <b>safe</b>.<br><br>

      <b>Input:</b> A single string of <code>0</code>s and <code>1</code>s (up to 100 characters long).<br><br>

      <b>Output:</b> Print <code>YES</code> if the string is safe, or <code>NO</code> if it is dangerous.<br><br>
      </html>
