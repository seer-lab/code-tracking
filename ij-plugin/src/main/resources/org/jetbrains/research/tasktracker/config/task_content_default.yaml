tasks:
  - description: "Using a Python testing framework of your choice, build a set of tests to meet statement coverage for grade_scale.py.\n\nPlease do not use AI tools to complete this task.\n\nStatement Coverage:\n\n- Causes every statement in the program to be executed at least once, giving us confidence that every statement is at least 
  capable of executing correctly.\n\n- System: Make a test case for each statement in the program, independent of the others.\n\n- Completion criterion: A test case for every statement.\n\nNote: You only need to do statement coverage for the provided code for this study.\n\nWhen you are done the task, please upload the file in LimeSurvey.\n\nThe files can be found in the tasktracker/Python/GradeScale/src in your project root."
