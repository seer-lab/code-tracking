      - filename: "grade_scale"
        sourceSet: "SRC"
        templateFile: "grade_scale"
        extension: PYTHON
        id: "grade_scale"
    openAllFiles: true

  - description: "Using a Python testing framework of your choice, build a set of tests to meet branch coverage for summarize_numbers.py\n\nPlease do not use AI tools to complete this task.\n\nBranch Coverage:\n\nCauses every decision (if, switch, while, etc.) in the program to be made both ways (or every possible way for switch).\n\nSystem: Design a test case to exercise each decision in the program each way (true/false).\n\nCompletion criterion: A test case for each side of each decision.\n\nNote: You only need to do branch coverage for the provided code for this study.\n\nWhen you are done the task, please upload the file in LimeSurvey.\n\nThe files can be found in the tasktracker/Python/SummarizeNumbers/src in your project root."
