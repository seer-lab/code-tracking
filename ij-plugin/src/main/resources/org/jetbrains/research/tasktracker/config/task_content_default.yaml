  - description: |
      <html>
      <b>Task:</b><br> Petya needs a program that processes a given string by performing the following steps in order:<br>
      1. Deletes all the vowels.<br>
      2. Inserts a character "." before each remaining consonant.<br>
      3. Replaces all uppercase consonants with corresponding lowercase ones.<br><br>
      <i>Note:</i> Vowels are the letters "A", "O", "Y", "E", "U", "I", and the rest are consonants.<br><br>
      <b>Input:</b><br>
      One string consisting of uppercase and lowercase Latin letters with a length from 1 to 100, inclusive.<br><br>
      
      <b>Output:</b><br> Print the resulting string. It is guaranteed that this string is not empty.<br><br>
      </html>
    id: "question5"
