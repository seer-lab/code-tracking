  - description: |
      <html>
      <b>Task:</b><br>
      Olesya loves numbers consisting of <b>n</b> digits, and Rodion loves numbers which are divisible by <b>t</b>.
      Find a number that makes both of them happy—a number with exactly <b>n</b> digits that is divisible by <b>t</b>.<br><br>
                             
      If no such number exists, print -1.<br><br>
                               
      <b>Input:</b><br>
      Two integers <b>n</b> and <b>t</b> (1 ≤ n ≤ 100, 2 ≤ t ≤ 10).<br><br>
                               
      <b>Output:</b><br>
      Print any <b>n</b>-digit integer (without leading zeros) that is divisible by <b>t</b>. If there is no such number, print -1.<br><br>
                                
      </html>
