      <html>
      <b>Input:</b> first line contains the number of statements in the program (not inclusive). The following lines contain the operations. Operations are “++” for addition by 1 r “--” for subtraction of 1. With X (the current value) before or after the operation (eg “X++” or “++X”). Not a valid input if other characters are present of “X” not used.<br><br>
      
